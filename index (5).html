    <style>
        :root { --bg: #05050a; --card: #0f1019; --accent: #6366f1; --text: #f8fafc; --muted: #94a3b8; --border: #1e293b; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: var(--bg); color: var(--text); min-height: 100vh; }
        header { background: rgba(15, 16, 25, 0.9); backdrop-filter: blur(10px); border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; padding: 1rem 5%; position: sticky; top: 0; z-index: 100; }
        .logo { font-size: 1.5rem; font-weight: 800; background: linear-gradient(135deg, #6366f1, #ec4899); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-decoration: none; }
        nav ul { display: flex; gap: 1.5rem; list-style: none; }
        nav ul li a { color: var(--muted); text-decoration: none; font-weight: 600; transition: 0.3s; }
        nav ul li a:hover, nav ul li a.active { color: var(--accent); }
        .hero { text-align: center; padding: 5rem 1rem; background: radial-gradient(circle, rgba(99,102,241,0.15) 0%, transparent 70%); }
        .hero h1 { font-size: 3rem; margin-bottom: 1rem; font-weight: 800; }
        .hero p { color: var(--muted); font-size: 1.2rem; max-width: 600px; margin: 0 auto; }
        .container { max-width: 1200px; margin: 0 auto; padding: 3rem 5%; text-align: center; }
        .btn { display: inline-block; background: linear-gradient(135deg, #6366f1, #4f46e5); color: white; padding: 0.8rem 1.8rem; border-radius: 8px; text-decoration: none; font-weight: 600; margin-top: 2rem; }
        footer { text-align: center; padding: 2rem; border-top: 1px solid var(--border); color: var(--muted); margin-top: 4rem; }
    </style>
</head>
